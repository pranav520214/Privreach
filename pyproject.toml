[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privreach"
version = "2.0.0"
description = "Privreach OS: Zero-Trust Local Scientific Workstation & Multimodal Reasoning Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Privreach Architecture Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pymupdf>=1.23.0",
    "gradio>=4.0.0",
    "rich>=13.0.0",
    "ollama>=0.1.0",
    "requests>=2.28.0",
    "sympy>=1.12.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "faster-whisper>=1.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.23.0",
    "networkx>=3.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
privreach = "privreach.cli:main"
privreach-server = "privreach.server.app:main"
privreach-web = "privreach.web.app:main"
privreach-updater = "privreach.updater.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
